<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Student Dashboard</title>

  <link rel="stylesheet"
        href="assignment.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

</head>

<body>

  <div class="container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <!-- LOGO -->

      <div class="logo">
        <h2>⚡ LearnX</h2>
      </div>

      <!-- PROFILE -->

      <div class="profile">

        <div class="profile-circle">
          Y
        </div>

        <div class="profile-info">

          <span class="name">
            Yuvraj
          </span>

          <span class="role">
            Frontend Learner
          </span>

        </div>

      </div>

      <!-- NAVIGATION -->

      <nav>

        <a href="#dashboard"
           class="active">
          Dashboard
        </a>

        <a href="#courses">
          Courses
        </a>

        <a href="#analytics">
          Analytics
        </a>

      </nav>

    </aside>

    <!-- MAIN CONTENT -->

    <main class="main-content">

      <!-- HERO SECTION -->

      <section class="hero card"
               id="dashboard">

        <div>

          <h1>
            Welcome Back, Yuvraj 👋
          </h1>

          <p>
            Continue your learning journey today.
          </p>

        </div>

        <div class="streak">
          🔥 12 Day Streak
        </div>

      </section>

      <!-- COURSES -->

      <section class="courses"
               id="courses">

        <!-- CARD 1 -->

        <article class="course-card card">

          <div class="course-top">
            <span>75%</span>
          </div>

          <h3>HTML Mastery</h3>

          <div class="progress-bar">

            <div class="progress progress1"></div>

          </div>

        </article>

        <!-- CARD 2 -->

        <article class="course-card card">

          <div class="course-top">
            <span>60%</span>
          </div>

          <h3>CSS Animation</h3>

          <div class="progress-bar">

            <div class="progress progress2"></div>

          </div>

        </article>

        <!-- CARD 3 -->

        <article class="course-card card">

          <div class="course-top">
            <span>40%</span>
          </div>

          <h3>JavaScript Basics</h3>

          <div class="progress-bar">

            <div class="progress progress3"></div>

          </div>

        </article>

      </section>

      <!-- ANALYTICS -->

      <section class="activity card"
               id="analytics">

        <h2>
          Weekly Activity
        </h2>

        <div class="graph-container">

          <div class="graph">

            <div class="graph-item">

              <div class="bar"
                   style="height:60%">
              </div>

              <span>HTML</span>

            </div>

            <div class="graph-item">

              <div class="bar"
                   style="height:80%">
              </div>

              <span>CSS</span>

            </div>

            <div class="graph-item">

              <div class="bar"
                   style="height:40%">
              </div>

              <span>JS</span>

            </div>

            <div class="graph-item">

              <div class="bar"
                   style="height:90%">
              </div>

              <span>React</span>

            </div>

            <div class="graph-item">

              <div class="bar"
                   style="height:70%">
              </div>

              <span>Node</span>

            </div>

          </div>

        </div>

      </section>

    </main>

  </div>

  <script src="script.js"></script>

</body>

</html>
